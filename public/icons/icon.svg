<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#334155" stroke-width="4" opacity="0.6" />

  <!-- Parkway Kala P Letter / Checkmark Logo Badge -->
  <g transform="translate(100, 96)">
    <!-- Shield / Card Background -->
    <rect x="20" y="20" width="272" height="280" rx="40" fill="#243046" stroke="#475569" stroke-width="6" />

    <!-- Gold Accent Bar -->
    <rect x="40" y="50" width="232" height="20" rx="8" fill="url(#goldGrad)" />
    
    <!-- Table Mock Rows -->
    <rect x="40" y="90" width="60" height="32" rx="6" fill="#f59e0b" />
    <rect x="110" y="90" width="162" height="32" rx="6" fill="#ffffff" opacity="0.9" />

    <rect x="40" y="136" width="60" height="32" rx="6" fill="#f59e0b" />
    <rect x="110" y="136" width="162" height="32" rx="6" fill="#ffffff" opacity="0.9" />

    <rect x="40" y="182" width="60" height="32" rx="6" fill="#f59e0b" />
    <rect x="110" y="182" width="162" height="32" rx="6" fill="#ffffff" opacity="0.9" />

    <!-- Checkmark Circle (Settled indicator) -->
    <circle cx="230" cy="235" r="44" fill="#10b981" stroke="#ffffff" stroke-width="6" />
    <path d="M214 235 L226 247 L248 223" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
